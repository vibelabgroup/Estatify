<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Estatify.ai - Advanced Real Estate MLS Platform | Property Management & AI Analytics</title>
    <meta name="title" content="Estatify.ai - Advanced Real Estate MLS Platform | Property Management & AI Analytics">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://estatify.ai/">
    <meta property="og:title" content="Estatify.ai - Advanced Real Estate MLS Platform">
    <meta property="og:description" content="Transform your real estate business with AI-powered property analytics, automated lead generation, and comprehensive property management tools.">

    <meta property="og:site_name" content="Estatify.ai">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://estatify.ai/">
    <meta property="twitter:title" content="Estatify.ai - Advanced Real Estate MLS Platform">
    <meta property="twitter:description" content="Transform your real estate business with AI-powered property analytics, automated lead generation, and comprehensive property management tools.">
    <meta property="twitter:image" content="https://estatify.ai/twitter-image.jpg">

    <meta name="keywords" content="real estate MLS, property management, AI analytics, real estate CRM, property listing, lead generation, real estate software, property database, real estate automation, MLS platform">
    <meta name="author" content="Estatify.ai">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://estatify.ai/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Estatify.ai",
      "url": "https://estatify.ai",
      "logo": "https://estatify.ai/logo.png",
      "description": "Advanced real estate MLS platform with AI-powered analytics and property management tools",
      "sameAs": [
        "https://www.linkedin.com/company/estatify",
        "https://twitter.com/estatify_ai"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-555-REAL-EST",
        "contactType": "sales",
        "availableLanguage": ["English"]
      }
    }
    </script>
    
    <!-- Structured Data - Software Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Estatify MLS Platform",
      "description": "Advanced real estate MLS platform with AI-powered analytics, property management, and lead generation tools",

      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
      }
    }
    </script>
    
    <!-- Structured Data - Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Estatify.ai Real Estate Solutions",
      "description": "Professional real estate MLS platform and property management software",
      "url": "https://estatify.ai",
      "telephone": "+1-555-REAL-EST",

        "@type": "PostalAddress",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "37.7749",
        "longitude": "-122.4194"
      },
      "openingHours": "Mo-Fr 09:00-18:00",
      "priceRange": "$$"
    }
    </script>
    
    <!-- DNS Prefetch for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://www.google-analytics.com">

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>

    <div id="root"></div>
